# ========== DOSYA: sentinel-intelligence/Cargo.toml ==========
[package]
name = "sentinel-intelligence"
version = "0.3.1"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tonic = "0.11"
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
phf = { version = "0.11", features = ["macros"] }

# Native Rust Machine Learning (GPU)
candle-core = "0.4.1"
candle-nn = "0.4.1"
candle-transformers = "0.4.1"
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }
hf-hub = "0.3"
half = "=2.3.1"
rand = "=0.8.5"

# Asenkron İletişim
async-nats = "0.34"
futures-util = "0.3"
chrono = "0.4"
serde_json = "1.0"

[build-dependencies]
tonic-build = "0.11"