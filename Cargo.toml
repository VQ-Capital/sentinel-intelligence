anyhow = "1.0"
phf = { version = "0.11", features = ["macros"] }
candle-core = "0.4.1"
candle-nn = "0.4.1"
half = "=2.3.1"
rand = "=0.8.5"
# EKLENEN YENİ BAĞIMLILIKLAR
async-nats = "0.34"
futures-util = "0.3"
chrono = "0.4"

[build-dependencies]
tonic-build = "0.11"