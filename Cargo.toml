# ========== DOSYA: sentinel-intelligence/Cargo.toml ==========
[package]
name = "sentinel-intelligence"
version = "4.0.1"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
futures-util = "0.3"

# AI Modülleri
ort = { version = "2.0.0-rc.9" } 
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }
phf = { version = "0.11", features = ["macros"] }

# IPC
tonic = "0.11"
async-nats = "0.34"

[build-dependencies]
tonic-build = "0.11"