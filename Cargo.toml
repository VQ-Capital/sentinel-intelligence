# sentinel-intelligence/Cargo.toml
[package]
name = "sentinel-intelligence"
version = "0.1.2"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tonic = "0.11"
prost = "0.12"
tracing = "0.1"
